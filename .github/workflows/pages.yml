name: Deploy Pages

on:
  push:
    branches:
      - feature/sqlite-engine
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run db:validate
      - run: npm run build
      - name: Copy database and sql.js WASM into the static site
        run: |
          mkdir -p dist/database dist/node_modules/sql.js/dist
          cp database/falcon.db dist/database/
          cp node_modules/sql.js/dist/sql-wasm.wasm dist/node_modules/sql.js/dist/
          cp node_modules/sql.js/dist/sql-wasm-browser.wasm dist/node_modules/sql.js/dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
